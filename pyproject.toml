[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [
  { name="Christopher McAdams", email="mca.christopher@gmail.com" }
]

name = "night-shift-cli"
description = "Get Times of sunrise sunset for provided location"
dependencies = ["requests>=2.28.0","pycairo>=1.29.1","pygobject>=3.56.3","argcomplete>=3.7.2" ]
readme = "README.md"
requires-python = ">=3.10"
version = "0.4.2.3-beta"

[project.urls]
Homepage = "https://github.com/christophermca/night-shift"

[project.scripts]
night-shift = "night_shift:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]

dev = [
  "black", "locust"
]

services = ["pycairo>=1.29.1", "PyGObject>=3.56.3"]

test = [
  "pytest", "pytest-cov", "freezegun"
]

[tool.setuptools.package-data]
"night_shift" =  [
  "schemas/*.xml", "services/systemd/user/*.timer", "services/systemd/user/*.service"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Linux",
]
