[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [
  { name="Christopher McAdams", email="mca.christopher@gmail.com" }
]

name = "night-shift"
description = "Get Times of sunrise sunset for provided location"
dependencies = ["requests>=2.28.0","pycairo","PyGObject" ]
readme = "README.md"
requires-python = ">=3.10"
version = "0.3.0"

[project.urls]
Homepage = "https://github.com/christophermca/night-shift"

[project.scripts]
night-shift = "night_shift:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]

dev = [
  "black", "locust"
]

test = [
  "pytest", "pytest-cov", "freezegun"
]

[tool.setuptools.package-data]
 "night-shift.data" =  ["schemas/*.xml", "services/systemd/user/*.timer", "services/systemd/user/*.service"]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Linux",
]
