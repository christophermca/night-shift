[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [
  { name="Christopher McAdams", email="mca.christopher@gmail.com" }
]
name = "night-shift"
description = "Get Times of sunrise sunset for provided location"
dependencies = ["requests>=2.28.0","pycairo","PyGObject" ]
readme = "README.md"
requires-python = ">=3.0"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/christophermca/night-shift"

[tool.pytest.ini_options]
pythonpath = ["src"]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Linux",
]

[tool.setuptools.packages.find]
where = ["src"]
