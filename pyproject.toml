[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [
  { name="Christopher McAdams", email="mca.christopher@gmail.com" }
]

name = "night-shift-cli"
description = "Get Times of sunrise sunset for provided location"
dependencies = ["requests>=2.28.0","argcomplete>=3.7.2","PyGObject>=3.48.0"]
readme = "README.md"
requires-python = ">=3.10"
version = "0.4.3"

[project.urls]
Homepage = "https://github.com/christophermca/night-shift"

[project.scripts]
night-shift = "night_shift:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]

dev = [
  "black", "locust"
]

services = [
  "night-shift-services>=0.0.2"
]

test = [
  "pytest", "pytest-cov", "freezegun", "tomli; python_version < '3.11'"
]

[tool.setuptools.package-data]
"night_shift" =  [
  "schemas/*.xml"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Linux",
]
