[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
authors = [
  { name="Christopher McAdams", email="mca.christopher@gmail.com" }
]

name = "night-shift-cli"
description = "Get Times of sunrise sunset for provided location"
dependencies = ["requests>=2.28.0","argcomplete>=3.7.2","PyGObject>=3.48.0"]
readme = "README.md"
requires-python = ">=3.10"


dynamic = ["version"] # "0.4.3

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]


[project.urls]
Homepage = "https://github.com/christophermca/night-shift"

[project.scripts]
night-shift = "night_shift:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]

dev = [
  "black", "locust"
]

services = [
  "night-shift-services>=0.0.2"
]

test = [
  "pytest", "pytest-cov", "freezegun", "tomli; python_version < '3.11'"
]

[tool.setuptools.package-data]
"night_shift" =  [
  "schemas/*.xml"
]

[tool.setuptools_scm]
# Only tags like cli-v0.4.3 count for this package
tag_regex = '^cli-v(?P<version>\d+\.\d+\.\d+)$'
git_describe_command = "git describe --dirty --tags --long --match 'cli-v*'"
local_scheme = "no-local-version"   # PyPI/TestPyPI reject the "+g1a2b3c" suffix
fallback_version = "0.0.0"          # used when there's no .git (e.g. git archive)
