name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      # libglib2.0-bin provides glib-compile-schemas for the schema tests.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      # [test] brings pytest, pytest-cov (pytest.ini uses --cov) and freezegun
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e ./gnome-night-shift

      - name: Run tests
        run: python -m pytest
