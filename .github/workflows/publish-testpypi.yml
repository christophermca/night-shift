name: Publish to TestPyPI

# Run by hand: Actions tab -> "Publish to TestPyPI" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package(s) to publish"
        type: choice
        options: [both, core, services]
        default: both

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      # libglib2.0-bin provides glib-compile-schemas for the schema tests.

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e ./services

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build . --outdir dist/core
          python -m build services --outdir dist/services
          python -m twine check --strict dist/core/* dist/services/*

      # Install the freshly built wheels together, the way a user would, so a
      # version-pin conflict between the two packages fails here, not on TestPyPI.
      #
      # Untagged commits build dev versions (0.4.4.dev3), which pip skips by
      # default. Instead of --pre (pre-releases for *every* package, requests
      # included), pin our two packages to the exact versions just built: a
      # pin that names a pre-release allows it for that package only.
      - name: Smoke-test the built wheels
        run: |
          for wheel in dist/*/*.whl; do
            file=$(basename "$wheel")          # night_shift_cli-0.4.4.dev3-py3-none-any.whl
            name=${file%%-*}                   # night_shift_cli
            version=${file#*-}; version=${version%%-*}   # 0.4.4.dev3
            echo "${name//_/-}==${version}"
          done > /tmp/constraints.txt
          cat /tmp/constraints.txt
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --constraint /tmp/constraints.txt \
            --find-links dist/core --find-links dist/services \
            "night-shift-cli[services]"
          /tmp/smoke/bin/night-shift --version
          /tmp/smoke/bin/night-shift services --help

      - uses: actions/upload-artifact@v7
        with:
          name: core-dist
          path: dist/core/
      - uses: actions/upload-artifact@v7
        with:
          name: services-dist
          path: dist/services/

  # Core goes first: night-shift-services depends on night-shift-cli.
  publish-core:
    needs: build
    if: inputs.package != 'services'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: core-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses a version twice; skip instead of failing, so
          # "both" works when only one package's version was bumped.
          skip-existing: true

  publish-services:
    needs: [build, publish-core]
    # Run after core, or when core was skipped because only services was picked.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && inputs.package != 'core'
      && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: services-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
