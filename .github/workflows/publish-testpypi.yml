name: Publish to TestPyPI

# Run by hand: Actions tab -> "Publish to TestPyPI" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package(s) to publish"
        type: choice
        options: [all, core, gnome]
        default: all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      # libglib2.0-bin provides glib-compile-schemas for the schema tests.

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e ./gnome-night-shift

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build . --outdir dist/core            # noc-shift
          python -m build gnome-night-shift --outdir dist/gnome
          python -m twine check --strict dist/*/*

      # Install the freshly built wheels together, the way a user would, so a
      # version-pin conflict between the packages fails here, not on TestPyPI.
      #
      # Untagged commits build dev versions (0.4.4.dev3), which pip skips by
      # default. Instead of --pre (pre-releases for *every* package, requests
      # included), pin our packages to the exact versions just built: a
      # pin that names a pre-release allows it for that package only.
      - name: Smoke-test the built wheels
        run: |
          for wheel in dist/*/*.whl; do
            file=$(basename "$wheel")          # noc_shift-0.4.4.dev3-py3-none-any.whl
            name=${file%%-*}                   # noc_shift
            version=${file#*-}; version=${version%%-*}   # 0.4.4.dev3
            echo "${name//_/-}==${version}"
          done > /tmp/constraints.txt
          cat /tmp/constraints.txt
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --constraint /tmp/constraints.txt \
            --find-links dist/core --find-links dist/gnome \
            gnome-night-shift              # pulls in noc-shift
          /tmp/smoke/bin/night-shift --version
          /tmp/smoke/bin/night-shift services --help

      - uses: actions/upload-artifact@v7
        with:
          name: core-dist
          path: dist/core/
      - uses: actions/upload-artifact@v7
        with:
          name: gnome-dist
          path: dist/gnome/

  # Core goes first: gnome-night-shift depends on noc-shift. A job skipped
  # because its package wasn't picked still lets the later one run.
  publish-core:
    needs: build
    if: inputs.package == 'all' || inputs.package == 'core'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: core-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses a version twice; skip instead of failing, so
          # "all" works when only some packages got a new version.
          skip-existing: true

  publish-gnome:
    needs: [build, publish-core]
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (inputs.package == 'all' || inputs.package == 'gnome')
      && contains(fromJSON('["success", "skipped"]'), needs.publish-core.result)
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gnome-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
