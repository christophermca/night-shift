name: Publish to TestPyPI
permissions:
  contents: read

# Run by hand: Actions tab -> "Publish to TestPyPI" -> Run workflow.
# Logs in with Trusted Publishing: the nocturne-shift project on test.pypi.org
# needs a publisher with repository christophermca/nocturne-shift, workflow
# `publish-testpypi.yml` and environment `test-pypi`.
# gnome-night-shift is published from its own repo:
# https://github.com/christophermca/gnome-night-shift
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      # libglib2.0-bin provides glib-compile-schemas for the schema tests.

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build . --outdir dist/core            # nocturne-shift
          python -m twine check --strict dist/*/*

      # Install the freshly built wheel the way a user would, so a broken
      # package or dependency fails here, not after the upload.
      #
      # Untagged commits build dev versions (0.4.4.dev3), which pip skips by
      # default. Instead of --pre (pre-releases for *every* package, requests
      # included), pin nocturne-shift to the exact version just built: a
      # pin that names a pre-release allows it for that package only.
      - name: Smoke-test the built wheels
        run: |
          for wheel in dist/*/*.whl; do
            file=$(basename "$wheel")          # nocturne_shift-0.4.4.dev3-py3-none-any.whl
            name=${file%%-*}                   # nocturne_shift
            version=${file#*-}; version=${version%%-*}   # 0.4.4.dev3
            echo "${name//_/-}==${version}"
          done > /tmp/constraints.txt
          cat /tmp/constraints.txt
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --constraint /tmp/constraints.txt \
            --find-links dist/core nocturne-shift
          /tmp/smoke/bin/nocturne-shift --version

      - uses: actions/upload-artifact@v7
        with:
          name: core-dist
          path: dist/core/

  publish-core:
    needs: build
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: core-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses a version twice; skip instead of failing.
          skip-existing: true
