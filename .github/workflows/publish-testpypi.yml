name: Publish to TestPyPI

  # Run by hand: Actions tab -> "Publish to TestPyPI" -> Run workflow.
  workflow_dispatch:
    inputs:
      package:
        description: "Which package(s) to publish"
        type: choice
        options: [both, core, services]
        default: both
      push:
        tags: ["testpypi-*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      # libglib2.0-bin provides glib-compile-schemas for the schema tests.

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e ./services

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build . --outdir dist/core
          python -m build services --outdir dist/services
          python -m twine check --strict dist/core/* dist/services/*

      # Install the freshly built wheels together, the way a user would, so a
      # version-pin conflict between the two packages fails here, not on TestPyPI.
      - name: Smoke-test the built wheels
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --find-links dist/core --find-links dist/services \
            "night-shift-cli[services]"
          /tmp/smoke/bin/night-shift --version
          /tmp/smoke/bin/night-shift services --help

      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/core/
      - uses: actions/upload-artifact@v4
        with:
          name: services-dist
          path: dist/services/

  # Core goes first: night-shift-services depends on night-shift-cli.
  publish-core:
    needs: build
    if: inputs.package != 'services'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses a version twice; skip instead of failing, so
          # "both" works when only one package's version was bumped.
          skip-existing: true

  publish-services:
    needs: [build, publish-core]
    # Run after core, or when core was skipped because only services was picked.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && inputs.package != 'core'
      && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: services-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
